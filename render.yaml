services:
  - type: web
    name: job-plus-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DEV_EXPOSE_OTP
        value: "false"
      - key: CLIENT_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: DEFAULT_UPI_VPA
        value: jobplus@upi
